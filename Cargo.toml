[package]
name = "freqfs"
version = "0.13.0"
authors = ["code@tinychain.net"]
edition = "2021"
license = "Apache-2.0"
description = "An in-memory filesystem cache layer over tokio::fs, with LFU eviction"
repository = "https://github.com/TinyChain-Inc/freqfs.git"
readme = "README.md"

categories = ["caching", "filesystem", "memory-management"]
keywords = ["file", "io", "cache"]

[[example]]
name = "example"

[features]
all = ["id", "logging"]
id = ["hr-id"]
logging = ["log"]

[dependencies]
async-recursion = "1.1"
ds-ext = { path = "../ds-ext", version = "0.4" }
futures = "0.3"
fs2 = "0.4"
hr-id = { path = "../hr-id", version = "0.7.0", optional = true }
log = { version = "0.4", optional = true }
safecast = "0.2"
tokio = { version = "1.39", features = ["fs", "io-util", "rt-multi-thread", "sync", "time"] }
trait-variant = "0.1"
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
destream = { path = "../destream", version = "0.10.1" }
tbon = { path = "../tbon", version = "0.9", features = ["tokio-io"] }
rand = "0.9"
tokio = { version = "1.39", features = ["macros"] }
